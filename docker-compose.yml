services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yam
      POSTGRES_PASSWORD: yam
      POSTGRES_DB: yam
    ports:
      - "5432:5432"
    volumes:
      - yam_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yam"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  yam_db_data:
