services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yam
      POSTGRES_PASSWORD: yam
      POSTGRES_DB: yam
    ports:
      # Host port 5433: this machine already has a native PostgreSQL service
      # bound to 5432, so the container is published on 5433 instead.
      - "5433:5432"
    volumes:
      - yam_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yam"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the backend reaches Postgres via the
      # service name on its container port, regardless of the host mapping.
      DATABASE_URL: postgresql+psycopg2://yam:yam@db:5432/yam
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  yam_db_data:
